<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">
<title>Ori · Solid-waddle</title>
<style>
@font-face{font-family:"Ori Text";src:url("https://ori-platform.vercel.app/fonts/OriText-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Ori Display";src:url("https://ori-platform.vercel.app/fonts/OriDisplay-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Ori Mono";src:url("https://ori-platform.vercel.app/fonts/OriMono-Regular.woff2") format("woff2");font-display:swap}
:root{color-scheme:dark;--bg:#171717;--panel:#202020;--text:#f5f5f4;--muted:#a3a3a3;--soft:#737373;--line:#383838;--accent:#e7e7e7;font-family:"Ori Text",Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
header{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 25px}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text)}.brand-mark{display:grid;place-items:center;width:27px;height:27px;border:1px solid #555;border-radius:50%;color:#f5f5f4;font:17px "Ori Display",serif}.brand small{color:var(--muted);font-size:11px;margin-left:3px}
.header-actions{display:flex;align-items:center;gap:8px}.link{color:#bdbdbd;text-decoration:none;font-size:12px;padding:8px 10px;border-radius:8px}.link:hover{background:#ffffff0b;color:white}
main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 22px 58px}
.chat-stage{width:min(820px,100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transform:translateY(-4%)}
.greeting{width:100%;text-align:center;margin:0}.eyebrow{font:10px "Ori Mono",monospace;letter-spacing:.14em;color:#858585;margin:0 0 15px;text-transform:uppercase}
h1{font:400 clamp(32px,4.2vw,48px)/1.08 "Ori Display","Ori Text",sans-serif;letter-spacing:-.045em;margin:0;color:#f5f5f4}
.composer{position:relative;width:100%;display:flex;align-items:flex-end;gap:8px;padding:10px;background:#202020;border:1px solid #393939;border-radius:18px;transition:border-color .18s,box-shadow .18s}
.composer:focus-within{border-color:#666;box-shadow:0 8px 30px rgb(0 0 0 / 20%)}
textarea{display:block;flex:1;width:100%;min-width:0;min-height:27px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:15px/1.6 "Ori Text",Arial,sans-serif;padding:3px 5px}
textarea::placeholder{color:#858585}
button{font:inherit;cursor:pointer;border-radius:50%;width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border:0;background:#f0f0ef;color:#171717;font-size:21px;line-height:1;transition:background .15s,opacity .15s}
button:hover:not(:disabled){background:#d4d4d4}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #d4d4d4;outline-offset:3px}button:disabled{cursor:default;opacity:.35}
.notice{min-height:18px;width:100%;text-align:center;margin:0;color:#929292;font-size:12px;line-height:1.5}
.notice.error{color:#c5c5c5}
footer{position:absolute;bottom:17px;left:0;right:0;display:flex;justify-content:center;color:#656565;font:9px "Ori Mono",monospace;letter-spacing:.08em}
@media(max-width:600px){header{padding:0 14px}.brand small{display:none}main{padding:16px 16px 54px}.chat-stage{gap:24px}h1{font-size:35px}.link{padding:8px 6px;font-size:11px}textarea{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-mark" aria-hidden="true">o</span><span>Ori <small>inside Solid-waddle</small></span></div>
  <nav class="header-actions" aria-label="Quick links"><a class="link" href="https://ori-platform.vercel.app/chat" target="_blank" rel="noopener noreferrer">Open Ori Platform ↗</a><a class="link" href="/browser" target="_blank" rel="noopener noreferrer">Browser ↗</a></nav>
</header>
<main>
  <section class="chat-stage" aria-labelledby="greeting-title">
    <div class="greeting">
      <p class="eyebrow">ORI · NEW CHAT</p>
      <h1 id="greeting-title">What’s on your mind today?</h1>
    </div>
    <form class="composer" id="chat-form" aria-label="Message Ori">
      <textarea id="message" rows="1" maxlength="8000" placeholder="Message Ori..." aria-label="Message Ori"></textarea>
      <button id="send-button" type="submit" aria-label="Send message" disabled>↑</button>
    </form>
    <p class="notice" id="status" role="status" aria-live="polite">Your message box is ready. Chat responses will be available when the Ori connection is enabled.</p>
  </section>
  <footer>ORI · DISPLAY / TEXT / MONO</footer>
</main>
<script>
(() => {
  const form = document.querySelector("#chat-form");
  const input = document.querySelector("#message");
  const send = document.querySelector("#send-button");
  const status = document.querySelector("#status");
  const greeting = document.querySelector("#greeting-title");
  const emptyPrompts = [
    "What’s on your mind today?",
    "What would you like to work on?",
    "What can we figure out together?",
    "What are you thinking about?",
    "Where should we start?",
    "What would you like to explore?",
    "What are you working on today?",
    "Got something on your mind?",
    "What should we tackle?",
    "What can Ori help with?",
    "Ready when you are.",
    "What are we working on?",
    "What would you like to figure out?",
    "Need a hand with something?",
    "What should we dive into?",
    "What’s up?",
    "What would you like to talk about?",
    "Have something in mind?",
    "What should we look at?",
    "What do you want to build today?"
  ];
  greeting.textContent = emptyPrompts[Math.floor(Math.random() * emptyPrompts.length)];
  input.addEventListener("input", () => {
    send.disabled = !input.value.trim();
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  });
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
  form.addEventListener("submit", event => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    status.classList.add("error");
    status.textContent = "This message hasn't been sent: the Solid-waddle Ori chat connection is intentionally waiting until the runtime is available again. Use “Open Ori Platform” to chat with Ori for now.";
  });
})();
</script>
</body>
</html>
